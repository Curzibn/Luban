name: DeepBlue Issue Intake

on:
  issues:
    types: [opened, reopened]

jobs:
  forward:
    runs-on: ubuntu-latest
    env:
      PROJECT_SLUG: luban
    steps:
      - name: Forward issue to DeepBlue intake
        env:
          INTAKE_TOKEN: ${{ secrets.DEEPBLUE_INTAKE_TOKEN }}
        run: |
          set -euo pipefail
          REPO_KEY=$(echo "${GITHUB_REPOSITORY#*/}" | tr 'A-Z' 'a-z')
          ISSUE_NUMBER=$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")
          PAYLOAD=$(jq -n \
            --arg ck "github-${REPO_KEY}-issue-${ISSUE_NUMBER}" \
            --arg project "$PROJECT_SLUG" \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg num "$ISSUE_NUMBER" \
            --arg title "$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")" \
            --arg body "$(jq -r '(.issue.body // "")[:6000]' "$GITHUB_EVENT_PATH")" \
            --arg user "$(jq -r '.issue.user.login' "$GITHUB_EVENT_PATH")" \
            --arg url "$(jq -r '.issue.html_url' "$GITHUB_EVENT_PATH")" \
            '{intake:"github-issues", conversation_key:$ck, resolution:"resume", project_slug:$project, initiator:("github:"+$user), text:("[GitHub Issue 监控] " + $repo + " 新增 issue #" + $num + "\n标题：" + $title + "\n作者：" + $user + "\n链接：" + $url + "\n\n正文：\n" + $body + "\n\n---\n值守契约：只做只读分析与呈报——不要对外回复 issue、不要修改仓库代码；分析结论写在最终回复里，平台会自动通知。")}')
          curl -fsS -X POST "https://deepblue.wizthink.cn/v1/intake" \
            -H "Authorization: Bearer ${INTAKE_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
